<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pleos 화면 목업</title>
<!--
  Pleos Connect 2.1.0 에뮬레이터(2560×1440) 화면을 좌표 그대로 옮긴 목업.
  Pleos가 그리는 곳: 상태바(오른쪽 위), DrivingView(왼쪽), 독(아래). 앱 칸(1682×1210)에는 앱이 최대 2개.
  기본 = 반 칸: 내비(운전자 쪽) + 차곡 841×1210. 전체 칸 = 앱 하나가 칸 전체.
  차곡 = 디자인 캔버스 "차곡 디자인" v4를 앱(CarActivity)과 같은 배치로: 반 칸은 위아래로 쌓고 전체 칸은 좌우.
  출발 전 탭(오늘 일정 · 발견 · 기록, 코스 바꾸기) / 주행 중(장소 사진 배경) / 들렀다 갈까요? / 통화 중 멈춤 / 도착 요약 / 영상일기.
  숫자(시간·거리·개수)는 .n으로 크고 굵게. 주행 중 배경은 장소 사진 3장을 천천히 넘김(움직임 줄이기 설정이면 고정). 다크·라이트는 위 막대.
  사진은 앱과 같은 샘플(photos/, 앱의 res/drawable-nodpi/photo_*.jpg). 왼쪽 차량 그림은 단순 실루엣.
-->
<style>
  :root { --ink:#243e37; --muted:#717e70; --paper:#fdfdfb; --line:#d9d9d9; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; background:#1d1f22; color:#eee; font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; overflow:hidden; }
  #bar { height:56px; display:flex; gap:8px; align-items:center; padding:0 16px; background:#2a2d31; flex-wrap:nowrap; overflow-x:auto; }
  #bar button, #bar input { font:inherit; font-size:14px; border-radius:8px; border:1px solid #555; background:#3a3e44; color:#eee; padding:7px 12px; white-space:nowrap; }
  #bar button.on { background:#e6e2c8; color:#222; border-color:#e6e2c8; }
  #bar input { flex:1; min-width:220px; background:#1f2226; }
  #bar .sep { width:1px; height:28px; background:#555; }
  #stage { position:absolute; top:56px; left:0; right:0; bottom:0; display:grid; place-items:center; }
  #screen { position:absolute; width:2560px; height:1440px; transform-origin:top left; background:#fff; color:#111; overflow:hidden; }

  .abs { position:absolute; }
  .t { position:absolute; white-space:nowrap; }
  /* Pleos DrivingView (left) */
  #drive { left:0; top:0; width:853px; height:1300px; background:#fff; border-right:1px solid #e5e5e5; }
  .pbox { background:#222; color:#fff; width:48px; height:48px; display:grid; place-items:center; font-size:30px; }
  /* Pleos status bar */
  #status { left:853px; top:0; width:1707px; height:90px; background:#f6f6f6; border:1px solid #cfcfcf; }
  /* right edge handle */
  #edge { left:2535px; top:90px; width:25px; height:1210px; background:#fafafa; }
  #edge i { position:absolute; left:8px; width:8px; height:8px; background:#111; }
  /* Pleos dock */
  #dock { left:0; top:1300px; width:2560px; height:140px; background:#000; color:#fff; }
  .dk { position:absolute; top:32px; width:76px; height:76px; display:grid; place-items:center; font-size:38px; border:0; color:#fff; background:transparent; cursor:pointer; padding:0; }
  .dk.boxed { background:#3c3c3c; }
  .dk.active::after { content:""; position:absolute; left:0; right:0; bottom:-24px; height:8px; background:#f39c12; }
  .dkt { position:absolute; top:44px; font-size:44px; }

  /* App slot (the only area Chagok draws) */
  #slot { left:853px; top:90px; width:1682px; height:1210px; overflow:hidden; }
  .app { position:absolute; inset:0; display:none; }
  .app.show { display:block; }
  /* half mode: navi window (driver side) + Chagok portrait window, both visible */
  #slot.split .app { display:block; }
  #slot.split #navi { right:auto; width:841px; }
  #slot.split #chagok { left:841px; box-shadow:-2px 0 0 #e6e4dc; }
  .center { left:50% !important; transform:translateX(-50%); }
  #slot.split #nav-me { top:560px !important; }
  #slot.split #nav-addr { top:666px !important; }

  /* Pleos navigation app (placeholder of the built-in navi) */
  #navi { background:#f6f7fa; }
  .nbtn { position:absolute; width:100px; background:#fff; border:1px solid #ddd; display:grid; place-items:center; font-size:34px; color:#111; }

  /* ───── Chagok: design v4 (canvas "차곡 디자인"), drawn like CarActivity at 2× (design unit 1 = 2px) ───── */
  #chagok { color:var(--tx); background:var(--s0); font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
            font-size:30px; line-height:1.5; word-break:keep-all; overflow-wrap:break-word; }
  #chagok.light { --s0:#F3F4F6; --s1:#FFFFFF; --s2:#EEF0F2; --s3:#E1E4E8; --tx:#101317; --mu:#5B636E; --inv:#101317; --on-inv:#FFFFFF; }
  #chagok.dark  { --s0:#0F1318; --s1:#1A2028; --s2:#232A34; --s3:#2F3844; --tx:#F3F5F8; --mu:#9AA4B2; --inv:#F3F5F8; --on-inv:#101317; }
  #chagok * { box-sizing:border-box; }
  :where(#chagok button) { font:inherit; color:inherit; background:none; border:0; padding:0; margin:0; cursor:pointer; text-align:inherit; }
  #pane { position:absolute; inset:0; }
  .cv { position:absolute; inset:0; display:flex; flex-direction:column; padding:48px; }
  .head { display:flex; align-items:center; gap:24px; margin-bottom:32px; flex:none; }
  .grow { flex:1; min-width:0; }
  .fill { flex:1; min-height:0; }
  .col { display:flex; flex-direction:column; min-height:0; }
  .rw { display:flex; align-items:center; min-width:0; }
  .g16 { gap:32px; } .g12 { gap:24px; } .g8 { gap:16px; }
  .ell { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .muted { color:var(--mu); }
  .num { font-variant-numeric:tabular-nums; }
  /* 숫자 강조: 시간·거리·개수는 본문보다 크고 굵게, 가장 진한 색(다크=흰색, 라이트=검정, 사진 위=흰색) */
  .n { color:var(--tx); font-weight:800; font-size:1.2em; line-height:1; font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
  .photo .n, .tag.glass .n { color:#fff; }
  .img { display:block; width:100%; height:100%; object-fit:cover; }
  .ic { width:44px; height:44px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  .ic.sm { width:36px; height:36px; } .ic.fill { fill:currentColor; stroke:none; }
  .scrolly { overflow-y:auto; scrollbar-width:none; } .scrolly::-webkit-scrollbar { display:none; }

  .h1 { font-size:56px; line-height:1.3; font-weight:800; } #slot.split .h1 { font-size:48px; line-height:1.25; }
  .h2 { font-size:44px; line-height:1.35; font-weight:750; }
  .t1 { font-size:34px; line-height:1.4; font-weight:700; }
  .t2 { font-size:30px; line-height:1.45; font-weight:600; }
  .cap { font-size:26px; line-height:1.5; color:var(--mu); }

  .btn { display:inline-flex; align-items:center; justify-content:center; gap:16px; height:104px; padding:0 52px; min-width:224px; border-radius:999px;
         font-size:32px !important; font-weight:700; white-space:nowrap; flex:none; transition:transform .12s; }
  .btn:active { transform:scale(.97); }
  .btn.pri, .btn.on { background:var(--inv); color:var(--on-inv); }
  .btn.sec { background:var(--s2); color:var(--tx); }
  .btn.wide { flex:1; min-width:0; }
  .btn.cmp { min-width:0; padding:0 36px; height:88px; }
  .cta { display:flex; gap:24px; flex:none; margin-top:32px; }
  .tag { display:inline-flex; align-items:center; gap:12px; height:60px; padding:0 24px; border-radius:999px; background:var(--s2); color:var(--mu);
         font-size:26px; font-weight:600; white-space:nowrap; flex:none; }
  .tag.glass { background:rgba(10,12,16,.48); color:#fff; backdrop-filter:blur(12px); }
  .seg { display:flex; gap:8px; padding:8px; border-radius:999px; background:var(--s3); flex:none; }
  .seg button { height:80px; padding:0 40px; border-radius:999px; font-weight:600; color:var(--mu); white-space:nowrap; }
  .seg button.on { background:var(--s1); color:var(--tx); }
  .card { background:var(--s1); border-radius:48px; }
  .photo { position:relative; border-radius:48px; overflow:hidden; background:var(--s3); color:#fff; flex:none; }
  .photo.sm { border-radius:32px; }
  .photo > .img { position:absolute; inset:0; }
  .scrim { position:absolute; inset:0; background:linear-gradient(180deg,rgba(7,9,12,.35) 0%,rgba(7,9,12,0) 28%,rgba(7,9,12,0) 45%,rgba(7,9,12,.82) 100%); }
  .photo .top { z-index:1; position:absolute; left:32px; right:32px; top:32px; display:flex; gap:12px; }
  .photo .bot { z-index:1; position:absolute; left:40px; right:40px; bottom:40px; }
  .photo.sm .top { left:24px; top:24px; } .photo.sm .bot { left:24px; right:24px; bottom:24px; }
  .stat { background:var(--s1); border-radius:48px; padding:32px 36px; display:flex; flex-direction:column; justify-content:flex-end; min-width:0; }
  .stat b { display:block; font-size:64px; line-height:1.15; font-weight:800; font-variant-numeric:tabular-nums; }
  #slot.split .rec .stat { padding:24px; } #slot.split .rec .stat b { font-size:50px; }
  .stat span { display:block; margin-top:8px; font-size:26px; color:var(--mu); font-weight:600; }
  .grid { display:grid; gap:24px; }

  /* voice mark: circle with three stacked bars */
  .mark { width:128px; height:128px; border-radius:50%; background:var(--inv); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; flex:none; position:relative; }
  .mark i { display:block; height:10px; border-radius:999px; background:var(--on-inv); }
  .mark i:nth-child(1) { width:56px; } .mark i:nth-child(2) { width:40px; } .mark i:nth-child(3) { width:24px; }
  .mark.lg { width:176px; height:176px; gap:10px; background:#fff; }
  .mark.lg i { height:12px; background:#101317; } .mark.lg i:nth-child(1) { width:76px; } .mark.lg i:nth-child(2) { width:54px; } .mark.lg i:nth-child(3) { width:32px; }
  .mark.hold { background:var(--s3); }
  .mark.talk::after { content:""; position:absolute; inset:-20px; border-radius:50%; box-shadow:0 0 0 6px rgba(255,255,255,.55); animation:mpulse 1.6s ease-out infinite; }
  .mark.talk i { animation:mtalk 1.1s ease-in-out infinite; } .mark.talk i:nth-child(2) { animation-delay:.15s; } .mark.talk i:nth-child(3) { animation-delay:.3s; }
  @keyframes mtalk { 0%,100% { transform:scaleX(1); } 50% { transform:scaleX(.5); } }
  @keyframes mpulse { 0% { transform:scale(.9); opacity:1; } 100% { transform:scale(1.25); opacity:0; } }

  /* 오늘 일정 */
  .body { display:flex; flex-direction:column; gap:32px; flex:1; min-height:0; }
  #slot:not(.split) .body { flex-direction:row; }
  .hero { height:300px; } .hero.rec { height:240px; }
  #slot:not(.split) .hero { height:auto; width:640px; } #slot:not(.split) .hero.rec { width:600px; }
  .plan { padding:24px 40px; }
  .row-stop { display:flex; align-items:center; gap:28px; min-height:112px; }
  #slot:not(.split) .row-stop { min-height:152px; }
  .row-stop .tm { width:112px; font-size:36px; font-weight:800; color:var(--tx); font-variant-numeric:tabular-nums; flex:none; }
  .rail { position:relative; width:32px; align-self:stretch; display:flex; justify-content:center; flex:none; }
  .rail::before { content:""; position:absolute; top:0; bottom:0; width:4px; background:var(--s3); }
  .first .rail::before { top:50%; } .last .rail::before { bottom:50%; }
  .rail i { position:relative; align-self:center; width:28px; height:28px; border-radius:50%; background:var(--s1); box-shadow:inset 0 0 0 6px var(--tx); }
  .first .rail i { background:var(--tx); }
  .thumb { width:88px; height:88px; border-radius:32px; overflow:hidden; flex:none; background:var(--s3); }
  #slot:not(.split) .thumb { width:104px; height:104px; }
  .thumb.sm { width:80px; height:80px; border-radius:24px; }

  /* 코스 바꾸기 */
  .courses { display:flex; flex-direction:column; gap:24px; flex:1; min-height:0; }
  #slot:not(.split) .courses { flex-direction:row; gap:32px; }
  .course { display:flex; flex:1; min-height:0; min-width:0; border-radius:48px; background:var(--s1); overflow:hidden; color:var(--tx); text-align:left; }
  #slot:not(.split) .course { flex-direction:column; }
  .course.sel { box-shadow:inset 0 0 0 6px var(--tx); }
  .course .photo { border-radius:0; width:260px; height:auto; }
  #slot:not(.split) .course .photo { width:auto; height:340px; }
  .course .in { padding:20px 24px 12px 32px; display:flex; flex-direction:column; justify-content:center; gap:4px; min-width:0; flex:1; }
  #slot:not(.split) .course .in { justify-content:flex-start; padding:32px 36px 36px; gap:16px; }
  .course .stop { display:flex; align-items:center; gap:16px; font-size:28px; font-weight:600; }
  .course .stop i { width:12px; height:12px; border-radius:50%; background:var(--mu); flex:none; }

  /* 발견 */
  .finds { grid-template-columns:repeat(2,minmax(0,1fr)); grid-auto-rows:minmax(0,1fr); flex:1; min-height:0; }
  .find { display:flex; flex-direction:column; min-height:0; border-radius:48px; background:var(--s1); overflow:hidden; }
  .find .photo { flex:1; height:auto; border-radius:0; }
  .find .info { padding:20px 28px 24px; display:flex; flex-direction:column; gap:16px; align-items:flex-start; }
  #slot:not(.split) .find .info { flex-direction:row; align-items:center; padding:24px 24px 24px 32px; }

  /* 기록 */
  .route { position:relative; display:flex; padding:40px 24px 32px; }
  .route::before { content:""; position:absolute; left:72px; right:72px; top:54px; height:6px; border-radius:999px; background:var(--inv); }
  .route .st { position:relative; flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:20px; text-align:center; }
  .route .st i { width:34px; height:34px; border-radius:50%; background:var(--s1); box-shadow:inset 0 0 0 8px var(--inv); }
  .route .st.end i { background:var(--inv); }
  .route .st span { font-size:26px; font-weight:700; line-height:1.35; }
  .stats4 { grid-template-columns:repeat(4,minmax(0,1fr)); } #slot.split .stats4 { gap:16px; }
  .saved { grid-template-columns:repeat(2,minmax(0,1fr)); grid-auto-rows:minmax(0,1fr); min-height:220px; flex:none; }
  #slot:not(.split) .saved { flex:1; }
  /* half window: the record scrolls (the app uses a ScrollView there) */
  #slot.split .body.rec .cta { position:sticky; bottom:0; z-index:2; padding-top:24px; background:var(--s0); }
  #slot.split .body.rec { overflow-y:auto; scrollbar-width:none; } #slot.split .body.rec > * { flex:none; } #slot.split .body.rec .card.fill { flex:none; min-height:220px; }

  /* 주행 중 */
  .live-bg { position:absolute; inset:0; }
  /* 이야기 중인 장소 사진 3장을 천천히 넘김: 8초씩, 1.4초 교차, 살짝 확대. 다시 그려도 이어지게 delay는 JS가 경과 시간만큼 당김 */
  .live-bg.slide { opacity:0; animation:kb 24s linear infinite both; }
  @keyframes kb { 0% { opacity:0; transform:scale(1); } 6% { opacity:1; } 33.3% { opacity:1; } 39.3% { opacity:0; transform:scale(1.08); } 100% { opacity:0; transform:scale(1.08); } }
  @media (prefers-reduced-motion:reduce) { .live-bg.slide { display:none; } }
  .live-shade { position:absolute; inset:0; background:linear-gradient(180deg,rgba(7,9,12,.5) 0%,rgba(7,9,12,.2) 25%,rgba(7,9,12,.62) 50%,rgba(7,9,12,.95) 100%); }
  .nextpill { display:inline-flex; align-items:center; gap:24px; height:112px; padding:0 48px 0 16px; border-radius:999px; background:var(--s1); color:var(--tx); }
  .navdot { width:80px; height:80px; border-radius:50%; background:var(--inv); color:var(--on-inv); display:grid; place-items:center; flex:none; }
  .upnext { width:600px; background:var(--s1); color:var(--tx); border-radius:48px; padding:32px 32px 8px; }
  .say { color:#fff; font-size:52px; line-height:1.5; font-weight:700; max-width:1200px; text-wrap:pretty; transition:opacity .6s; }
  #slot:not(.split) .say { font-size:60px; max-width:1700px; }
  .say.said { opacity:.72; }
  .say.fresh { animation:sayin .45s ease-out both; }
  @keyframes sayin { from { opacity:0; transform:translateY(18px); } }

  /* 영상일기 */
  .dur { font-size:56px; font-weight:800; color:var(--tx); }
  .diary .dpv { height:330px; }
  #slot:not(.split) .diary .dpv { width:56%; height:auto; }
  .dpv .play { position:absolute; z-index:1; left:50%; top:45%; transform:translate(-50%,-50%); width:128px; height:128px; border-radius:50%; background:rgba(255,255,255,.92); color:#101317; display:grid; place-items:center; }
  .dpv .play .ic { width:56px; height:56px; margin-left:6px; }
  #slot.split .dpv .play { top:32%; width:104px; height:104px; }
  .prog { display:flex; gap:10px; } .prog i { flex:1; height:8px; border-radius:999px; background:rgba(255,255,255,.35); } .prog i.on { background:#fff; }
  .chaps { display:flex; gap:24px; overflow-x:auto; flex:none; }
  .chap { display:flex; flex-direction:column; gap:8px; width:150px; flex:none; }
  .chap .thumb { width:150px; height:96px; }
  #slot:not(.split) .chap .thumb { height:110px; }
  .memo { padding:24px 32px; flex:none; }
  .mic { position:relative; width:96px; height:96px; border-radius:50%; background:var(--inv); color:var(--on-inv); display:grid; place-items:center; flex:none; }
  .mic .ic { width:48px; height:48px; }
  .mic.rec { background:#E5484D; color:#fff; }
  .mic.rec::after { content:""; position:absolute; inset:-14px; border-radius:50%; box-shadow:0 0 0 5px rgba(229,72,77,.5); animation:mpulse 1.6s ease-out infinite; }

  /* sheet, toast */
  .sheetwrap { position:absolute; inset:0; background:rgba(7,9,12,.6); display:flex; flex-direction:column; justify-content:flex-end; z-index:20; }
  .sheet { background:var(--s1); border-radius:48px 48px 0 0; padding:24px 48px 48px; }
  .grab { display:block; width:80px; height:8px; border-radius:999px; background:var(--s3); margin:0 auto 32px; }
  .sheet .lay { display:flex; flex-direction:column; gap:32px; }
  #slot:not(.split) .sheet .lay { flex-direction:row; align-items:stretch; }
  .sheet .lay .photo { height:300px; }
  #slot:not(.split) .sheet .lay .photo { width:38%; height:auto; min-height:360px; }
  .sheet .sstats { grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
  .sheet .stat { background:var(--s2); }
  .sheet .stat b.long { font-size:30px; line-height:1.3; }
  #toast { position:absolute; left:50%; transform:translateX(-50%); display:none; align-items:center; gap:20px; max-width:92%; min-height:104px; padding:24px 48px; border-radius:999px;
           background:var(--inv); color:var(--on-inv); font-size:30px; font-weight:600; z-index:30; white-space:nowrap; }
  #toast.on { display:flex; }
  #toast.top { top:208px; } #toast.bottom { bottom:200px; }

  /* "who draws what" overlay */
  .zone { position:absolute; display:none; pointer-events:none; font-size:30px; font-weight:700; padding:14px 18px; align-items:flex-start; }
  body.zones .zone { display:flex; }
  .zone span { background:rgba(255,255,255,.92); padding:6px 14px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.15); }
  .zone.pleos { background:rgba(230,80,60,.13); outline:4px dashed rgba(220,70,50,.8); outline-offset:-4px; color:#b23a2a; }
  .zone.ours { background:rgba(40,160,90,.10); outline:6px solid rgba(30,150,80,.9); outline-offset:-6px; color:#17803f; }
</style>
</head>
<body>
<div id="bar">
  <button id="b-split" class="on">반 칸 (내비 옆)</button>
  <button id="b-chagok">차곡 전체 칸</button>
  <button id="b-navi">내비 전체 칸</button>
  <span class="sep"></span>
  <button id="b-zones">누가 그리나 표시</button>
  <button id="b-theme">다크 → 라이트</button>
  <span class="sep"></span>

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

  "강릉":[["경포대", "지역 이야기와 맞아요", "6분 추가", "항상 열림"], ["오죽헌", "역사 이야기", "9분 추가", "18시까지"],

  "양양":[["하조대", "바다 관심사와 맞아요", "6분 추가", "항상 열림"], ["남애항", "카페 관심사와 맞아요", "10분 추가", "항상 열림"]],
};
const findsFor = d => (FINDS[d] || []).map(([name, reason, extra, open]) => ({ name, reason, extra, open }));
// What the backend would send while driving (demo).
const LINES = [
  { text:"지금 지나는 청초호는 바닷물이 드나들던 석호래요. 해 질 무렵 호수 둘레길이 제일 예뻐요.", place:{ name:"청초호 둘레길", extra:"8분 추가", reason:"방금 들은 이야기", open:"항상 열림" } },
  { text:"아바이마을 바로 앞에 갯배 선착장이 있어요. 줄을 당겨 건너는 배인데, 2분이면 가요.", place:{ name:"갯배 선착장", extra:"2분 추가", reason:"가는 길 바로 옆", open:"22시까지" } },
  { text:"속초 중앙시장 닭강정은 줄 서서 먹는 게 국룰이래요. 돌아오는 길에 들러 볼까요?", place:{ name:"속초중앙시장", extra:"5분 추가", reason:"맛집 관심사와 맞아요", open:"20시까지" } },
  { text:"영금정 가는 길에 등대 전망대가 있어요. 바다가 한눈에 보인대요.", place:{ name:"속초등대전망대", extra:"7분 추가", reason:"바다 관심사와 맞아요", open:"18시까지" } },
];

let S;
function fresh(keepTrip) {
  const ti = keepTrip && S ? S.ti : 0;
  S = { ti, tab:"plan", showTrips:false, phase:"start", route:trips[ti].places.slice(), visited:0, saved:[], heard:0, waypoints:0,
        cur:null, slideAt:0, diary:false, memo:null, speaking:false, held:null, call:false, sheet:false, li:0, fresh:false };
}
fresh();
const trip = () => trips[S.ti];

const batchim = w => { const c = w.charCodeAt(w.length - 1) - 0xAC00; return c >= 0 && c <= 11171 ? c % 28 : 0; };
const ro = w => w + (batchim(w) && batchim(w) !== 8 ? "으로" : "로");
const wa = w => w + (batchim(w) ? "과" : "와");
// "1시간 20분" / "40분" → minutes; today's course = drive to each stop + time spent there (sample estimates; the navi has the real drive).
const mins = v => { const m = /(?:(\d+)\s*시간)?\s*(?:(\d+)\s*분)?/.exec(v || ""); return (+m[1] || 0) * 60 + (+m[2] || 0); };
const hm = n => n >= 60 ? `${Math.floor(n / 60)}시간${n % 60 ? ` ${n % 60}분` : ""}` : `${n}분`;
const total = r => { const n = r.reduce((a, p) => a + mins(p.eta) + mins(p.stay), 0); return n ? hm(n) : ""; };
const detour = p => (/(\d+)\s*분\s*추가/.exec((p && p.extra) || "") || [])[1];

// ── click registry: every tappable element carries data-a = index of its handler ──
let acts = [];
const on = fn => { acts.push(fn); return `data-a="${acts.length - 1}"`; };
$("chagok").addEventListener("click", e => { const el = e.target.closest("[data-a]"); if (el && $("chagok").contains(el)) acts[el.dataset.a](e); });

// ── pieces (CarActivity building blocks) ──
const ICON = {
  pin:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  check:'<svg class="ic" viewBox="0 0 24 24" style="stroke-width:3" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  checkSm:'<svg class="ic sm" viewBox="0 0 24 24" style="stroke-width:3" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  bookmark:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h12v17l-6-4.2-6 4.2z"/></svg>',
  mic:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>',
  play:'<svg class="ic fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>',
  nav:'<svg class="ic fill sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 18-7-4-7 4z"/></svg>',
};
// Escape, then wrap numbers (+8분, 1시간, 22시, 2곳, 11:00, 1/2, 3.2 km) so they stand out.
const nm = t => esc(t).replace(/\+?\d+(?:[:.\/]\d+)?(?:\s?(?:시간|분|초|km|m|곳|개|시|일|월|장))?/g, x => `<b class="n">${x}</b>`);
const tag = (t, glass, icon = "") => `<span class="tag${glass ? " glass" : ""}">${icon}${nm(t)}</span>`;
const btn = (label, kind, fn, extra = "") => `<button class="btn ${kind}" ${on(fn)} ${extra}>${label}</button>`;
const photo = (src, cls = "", top = [], bot = "") => `<div class="photo ${cls}"><img class="img" src="${src}" alt="">${top.length || bot ? '<div class="scrim"></div>' : ""}
  ${top.length ? `<div class="top">${top.join("")}</div>` : ""}${bot ? `<div class="bot">${bot}</div>` : ""}</div>`;
const mark = (cls, fn, label) => `<button class="mark ${cls}" ${on(fn)} aria-label="${label}"><i></i><i></i><i></i></button>`;
const stat = (v, k, long) => `<div class="stat"><b class="${long ? "long" : ""}">${esc(v)}</b><span>${esc(k)}</span></div>`;

function render() {
  acts = [];
  const live = S.phase === "live";
  $("pane").innerHTML = (live ? liveView() : S.diary ? diaryView() : tabsView()) + (live && S.sheet && S.cur && S.cur.place ? sheetView() : "");
  $("toast").className = $("toast").className.replace(/\b(top|bottom)\b/g, "").trim() + (live ? " top" : " bottom");
  S.fresh = false;
}

// ── before departure / arrival: tabs on top ──
function tabsView() {
  const arrived = S.phase === "arrive", shown = arrived ? "record" : S.tab;
  const seg = [["plan", "오늘 일정"], ["find", "발견"], ["record", "기록"]].map(([k, l]) =>
    `<button class="${k === shown ? "on" : ""}" ${on(() => { S.tab = k; S.showTrips = false; render(); })}>${l}</button>`).join("");
  const body = shown === "find" ? findTab() : shown === "record" ? recordTab(arrived) : S.showTrips ? tripsTab() : planTab();
  return `<div class="cv"><div class="head"><div class="seg">${seg}</div><span class="grow"></span>
    ${mark(S.speaking ? "talk" : "", () => voice(`오늘은 ${ro(trip().dest)} 떠나는 날이에요. 준비되면 출발하자고 말해 주세요.`), "차곡에게 듣기")}</div>${body}</div>`;
}
function planTab() {
  const t = trip(), r = S.route;
  const stops = [`<div class="row-stop first${r.length ? "" : " last"}"><span class="tm">지금</span><span class="rail"><i></i></span>
      <span class="grow col"><b class="t1 ell">여기서 출발</b><span class="cap ell">${r[0] ? nm(r[0].eta + " 뒤 첫 장소에 도착해요") : ""}</span></span></div>`]
    .concat(r.map((p, i) => `<div class="row-stop${i === r.length - 1 ? " last" : ""}"><span class="tm">${esc(p.time || "")}</span><span class="rail"><i></i></span>
      <span class="thumb"><img class="img" src="${photoOf(p.name)}" alt=""></span>
      <span class="grow col"><b class="t1 ell">${esc(p.name)}</b><span class="cap ell">${nm(p.stay ? p.stay + " 머물러요" : p.extra || "")}</span></span></div>`)).join("");
  return `<div class="body">
    ${photo(photoOf(t.dest), "hero", [tag(t.date, 1), tag(wa(t.who) + " 함께", 1)], `<h1 class="h1" style="margin:0">오늘은 ${ro(t.dest)}<br>떠나는 날이에요</h1>`)}
    <div class="col fill">
      <div class="card plan col fill scrolly">
        <div class="rw g8" style="margin-bottom:8px"><b class="t1 grow">${t.dest} 여행 일정</b>${total(r) ? tag(`총 ${total(r)}`) : ""}${tag(t.mood)}</div>
        ${stops}
        <div class="rw g8" style="margin-top:20px;flex-wrap:wrap"><b class="t2">${nm(r.length + "곳 들러요")}</b>${t.tags.map(x => tag(x)).join("")}</div>
      </div>
      <div class="cta">${btn("코스 바꾸기", "sec", () => { S.showTrips = true; render(); })}${btn("출발하기", "pri wide", startTrip)}</div>
    </div></div>`;
}
function tripsTab() {
  const cards = trips.map((t, i) => `<button class="course${i === S.ti ? " sel" : ""}" ${on(() => { if (i !== S.ti) { S.ti = i; S.route = trips[i].places.slice(); render(); } })}>
      ${photo(photoOf(t.dest), "", [tag(`경유지 ${t.places.length}곳`, 1)], `<b class="h2">${t.dest}</b>`)}
      <span class="in"><span class="cap ell">${nm(t.date)}, ${wa(t.who)}, ${t.mood}</span>${t.places.map(p => `<span class="stop"><i></i><span class="ell">${nm(p.time)}  ${p.name}</span></span>`).join("")}</span>
    </button>`).join("");
  return `<div class="col fill"><div class="courses">${cards}</div>
    <div class="cta">${btn("닫기", "on", () => { S.showTrips = false; render(); })}${btn(`${trip().dest} 코스로 출발하기`, "pri wide", startTrip)}</div></div>`;
}
function findTab() {
  const items = findsFor(trip().dest);
  if (!items.length) return `<div class="fill" style="display:grid;place-items:center"><span class="t2 muted">가는 길에 들를 만한 곳을 찾으면 여기 보여 드려요</span></div>`;
  return `<div class="grid finds">${items.map(f => { const added = S.route.some(p => p.name === f.name);
    return `<div class="find">${photo(photoOf(f.name), "", [tag(f.reason, 1)])}
      <div class="info"><span class="grow col" style="width:100%"><b class="t1 ell">${f.name}</b><span class="cap ell">${nm(f.extra + ", " + f.open)}</span></span>
        ${btn(added ? "추가됨" : "추가", (added ? "on" : "sec") + " cmp", () => addFromFind(f))}</div></div>`; }).join("")}</div>`;
}
function recordTab(arrived) {
  const t = trip(), names = ["출발"].concat(S.route.map(p => p.name));
  const stats = arrived ? [[t.km, "이동 거리"], [t.time, "걸린 시간"], [S.route.length + "곳", "들른 장소"], [S.heard + "개", "들은 이야기"]]
    : [[t.places.length + "곳", "계획한 장소"], [S.saved.length + "곳", "담은 곳"], [S.waypoints + "/2", "경유지"], [S.heard + "개", "들은 이야기"]];
  const saved = S.saved.length
    ? `<div class="grid saved fill">${S.saved.slice(0, 2).map(n => photo(photoOf(n), "sm", [tag("담은 곳", 1)], `<b class="t1">${esc(n)}</b>`)).join("")}</div>`
    : `<div class="card fill" style="display:grid;place-items:center"><span class="t2 muted">가는 길에 담은 곳이 여기 모여요</span></div>`;
  return `<div class="body rec">
    ${photo(PH(ARRIVE[t.dest] || PHOTOS[t.dest]), "hero rec", [], `<h1 class="h1" style="margin:0">${arrived ? t.dest + "에<br>도착했어요" : "오늘의<br>기록"}</h1>`)}
    <div class="col fill g16">
      <div class="card"><div class="route">${names.map((n, i) => `<div class="st${i === names.length - 1 ? " end" : ""}"><i></i><span class="ell" style="max-width:100%">${esc(n)}</span></div>`).join("")}</div></div>
      <div class="grid stats4">${stats.map(([v, k]) => stat(v, k)).join("")}</div>
      ${saved}
      <div class="cta" style="margin-top:0">${arrived ? btn("처음으로", "sec", backToStart) + btn(`${ICON.play}영상일기 남기기`, "pri wide", openDiary)
          : btn("폰에서 기록 이어가기", "pri wide", () => toast("폰의 차곡 기록에서 사진과 메모를 이어서 남길 수 있어요"))}</div>
    </div></div>`;
}

// ── live: the place photo fills the panel ──
// Photo stack that crossfades slowly (CSS .slide). Delays are pulled back by the time since S.slideAt so a re-render continues, not restarts.
function slides(pics) {
  const gone = (Date.now() - S.slideAt) / 1000;
  return `<img class="img live-bg" src="${pics[0]}" alt="">` + (pics.length < 2 ? "" :
    [0, 1, 2].map(i => `<img class="img live-bg slide" src="${pics[i % pics.length]}" alt="" style="animation-delay:${(i * 8 - gone).toFixed(2)}s">`).join(""));
}
function liveView() {
  const c = S.cur || {}, p = c.place, next = S.route[S.visited], rest = S.route.slice(S.visited + 1);
  const full = !$("slot").classList.contains("split");
  const pill = next ? `<div class="nextpill"><span class="navdot">${ICON.nav}</span><span class="t2 muted">다음</span><b class="t1 ell">${esc(next.name)}</b><span class="t1">${nm(next.eta || "")}</span></div>` : "";
  const up = full && rest.length ? `<div class="upnext">${rest.map(x => `<div class="rw g12" style="margin-bottom:24px"><span class="thumb sm"><img class="img" src="${photoOf(x.name)}" alt=""></span>
      <b class="t2 grow ell">${esc(x.name)}</b><span class="t2">${nm(x.time || x.eta || "")}</span></div>`).join("")}</div>` : "";
  const kept = p && S.saved.includes(p.name);
  const chip = !p ? "" : kept
    ? btn(`${ICON.check}${esc(p.name)}<span style="opacity:.6">담았어요</span>`, "", openSheet, 'style="background:#fff;color:#101317"')
    : btn(`${ICON.pin}${esc(p.name)}<span>${nm(p.extra || "")}</span>`, "", openSheet, 'style="background:var(--s1);color:var(--tx)"');
  return `${slides(galleryOf(p ? p.name : next ? next.name : trip().dest))}<div class="live-shade"></div>
    <div class="cv"><div class="rw" style="justify-content:space-between;align-items:flex-start">${pill}${up}</div>
      <div class="fill"></div>
      <div class="rw g16">${mark("lg" + (S.speaking ? " talk" : "") + (S.held ? " hold" : ""), () => { S.held = null; if (S.speaking) { stopVoice(); S.speaking = false; render(); } }, "차곡, 말하는 중이면 눌러서 멈추기")}
        <span class="t2" style="color:#fff;opacity:.8">${S.speaking ? "누르면 멈춰요" : S.held ? "통화가 끝나면 이어서 읽어요" : ""}</span></div>
      <p class="say${S.cur && !S.speaking && !S.held ? " said" : ""}${S.fresh ? " fresh" : ""}" style="margin:48px 0 0">${esc(c.text || "")}</p>
      ${chip ? `<div style="margin-top:48px">${chip}</div>` : ""}
    </div>`;
}
function sheetView() {
  const p = S.cur.place, d = detour(p), open = p.open || "확인 필요";
  return `<div class="sheetwrap" ${on(e => { if (e.target.classList.contains("sheetwrap")) { S.sheet = false; render(); } })}>
    <div class="sheet" role="dialog" aria-label="${esc(p.name)}, 들렀다 갈까요?"><span class="grab"></span>
      <div class="lay">${photo(photoOf(p.name), "", [tag("담아 뒀어요", 1, ICON.checkSm)], `<h2 class="h2" style="margin:0">${esc(p.name)}, 들렀다 갈까요?</h2>`)}
        <div class="col g16 grow">${p.reason ? `<span>${tag(p.reason)}</span>` : ""}
          <div class="grid sstats">${stat(d ? "+" + d + "분" : "확인 필요", "추가 시간")}${stat(open, "방문 가능", open.length > 4)}${stat(S.waypoints + "/2", S.waypoints >= 2 ? "경유지 가득 참" : "내비 경유지")}</div>
          <div class="cta" style="margin-top:0">${btn(`${ICON.bookmark}담아 두기`, "sec", () => decide(false))}${btn("경로에 추가", "pri wide", () => decide(true))}</div>
        </div></div></div></div>`;
}

// ── actions (CarActivity) ──
// 영상일기 (도착 후, 정차 중): 오늘 들른 곳·담은 곳 사진 + 들은 이야기 자막 + 운전자 한마디 → 1분 영상. 편집·공유는 폰에서.
function openDiary() { S.diary = true; S.slideAt = Date.now(); S.memo = null; render(); }
function diaryView() {
  const t = trip(), stops = S.route.concat(S.saved.filter(n => !S.route.some(p => p.name === n)).map(name => ({ name, kept:true })));
  const pics = stops.map(p => photoOf(p.name)).filter((x, i, a) => a.indexOf(x) === i).slice(0, 3);
  const line = S.heard ? LINES[0].text : `${t.dest}까지 오늘의 길을 1분 영상으로 묶었어요.`;
  const chaps = [{ name:"출발", time:"09:10", pic:PH(PHOTOS[t.dest] || "waves") }].concat(stops.map(p => ({ name:p.name, time:p.kept ? "담은 곳" : p.time || "들른 곳", pic:photoOf(p.name) })));
  const mic = (rec, label) => `<button class="mic${rec ? " rec" : ""}" ${on(rec ? () => {} : recordMemo)} aria-label="${label}">${ICON.mic}</button>`;
  const memo = S.memo === "rec" ? `${mic(true, "녹음 중")}<span class="t2 grow">듣고 있어요. 오늘 어땠는지 한마디 해 주세요</span>`
    : S.memo ? `${mic(false, "한마디 다시 남기기")}<span class="t2 grow">${nm("마지막 장면에 " + S.memo + "초 한마디를 넣었어요")}<br><span class="cap">다시 누르면 새로 남겨요</span></span>`
    : `${mic(false, "한마디 남기기")}<span class="t2 grow">오늘의 한마디 남기기<br><span class="cap">영상 마지막에 내 목소리로 들어가요</span></span>`;
  return `<div class="cv"><div class="head"><span class="col grow"><b class="h2">오늘의 영상일기</b><span class="cap">${nm(`${t.dest} · ${t.date} · 장면 ${chaps.length}개 · 이야기 ${S.heard}개`)}</span></span>
      <b class="dur">${nm("1:12")}</b></div>
    <div class="body diary">
      <div class="photo dpv">${slides(pics.length ? pics : [PH(PHOTOS[t.dest] || "waves")])}<div class="scrim"></div>
        <div class="top">${tag("미리보기", 1)}</div><span class="play">${ICON.play}</span>
        <div class="bot"><p class="t2" style="margin:0 0 24px;color:#fff">“${esc(line)}”</p>
          <div class="prog">${chaps.map((c, i) => `<i class="${i === 0 ? "on" : ""}"></i>`).join("")}</div></div></div>
      <div class="col fill g16">
        <div class="chaps scrolly">${chaps.map(c => `<div class="chap"><span class="thumb"><img class="img" src="${c.pic}" alt=""></span><b class="t2">${nm(c.time)}</b><span class="cap ell">${esc(c.name)}</span></div>`).join("")}</div>
        <div class="rw g8" style="flex-wrap:wrap">${tag("이야기 자막", 0, ICON.checkSm)}${tag("배경음 잔잔한", 0, ICON.checkSm)}${tag("길 위의 소리", 0)}</div>
        <div class="card rw g12 memo">${memo}</div>
        <div class="fill"></div>
        <div class="cta" style="margin-top:0">${btn("닫기", "sec", () => { S.diary = false; render(); })}${btn("폰으로 보내기", "pri wide", () => toast("폰의 차곡 기록으로 보냈어요. 사진을 더하고 공유할 수 있어요"))}</div>
      </div></div></div>`;
}
function recordMemo() {
  S.memo = "rec"; render();
  setTimeout(() => { if (S.memo === "rec") { S.memo = 8; render(); } }, 3000);
}
function startTrip() {
  S.phase = "live"; S.showTrips = false; S.tab = "plan"; S.visited = 0;
  S.waypoints = Math.min(2, Math.max(0, S.route.length - 1)); // the navi gets the last stop as destination, the rest as waypoints
  const first = S.route[0];
  showLine({ text:first ? `출발! 먼저 ${ro(first.name)} 가요. 가는 길에 재밌는 이야기가 보이면 들려줄게요.` : "출발! 가는 길에 재밌는 이야기가 보이면 들려줄게요." }, false);
}
function showLine(line, counts) { if (!S.cur || (S.cur.place || {}).name !== (line.place || {}).name) S.slideAt = Date.now(); S.cur = line; S.fresh = true; if (counts) S.heard++; if (S.phase !== "live") { S.phase = "live"; S.sheet = false; } render(); voice(line.text); }
function nextLine() { showLine(LINES[S.li++ % LINES.length], true); }
function openSheet() { const p = S.cur.place; if (!S.saved.includes(p.name)) S.saved.push(p.name); S.sheet = true; render(); }
function decide(ok) {
  const p = S.cur.place; S.sheet = false;
  if (!ok) { render(); return toast(`${p.name}, 기록에만 담아 둘게요`); }
  if (S.waypoints >= 2) { render(); return toast("내비 경유지는 2곳까지라 기록에만 넣었어요"); }
  S.waypoints++;
  if (!S.route.some(x => x.name === p.name)) S.route.splice(S.visited, 0, { name:p.name, eta:(detour(p) || "?") + "분", extra:p.extra });
  render(); toast(`${p.name}, 내비 경유지에 넣었어요`);
}
function addFromFind(f) {
  if (S.route.some(p => p.name === f.name)) return;
  if (!S.saved.includes(f.name)) S.saved.push(f.name);
  if (S.route.length >= 3) { render(); return toast("경유지는 2곳까지라 기록에만 넣었어요"); }
  S.route.unshift({ name:f.name, eta:(detour(f) || "?") + "분", extra:f.extra });
  render(); toast(`${f.name}, 출발하면 내비에 같이 넣을게요`);
}
function arrive() {
  if (S.phase === "arrive") return;
  stopVoice(); S.phase = "arrive"; S.speaking = false; S.held = null; S.sheet = false; S.visited = S.route.length;
  clearInterval(auto); auto = null; $("b-auto").classList.remove("on");
  if (mode === "navi") front("chagok");
  render();
}
function backToStart() { stopVoice(); fresh(true); render(); }

// ── voice (TTS stand-in) + 대화 중엔 일시정지 ──
let vid = 0;
function voice(text) {
  if (S.call) { S.held = text; S.speaking = false; render(); return; }
  stopVoice(); const id = vid; S.speaking = true; render();
  const done = () => { if (vid === id && S.speaking) { S.speaking = false; render(); } };
  try { const u = new SpeechSynthesisUtterance(text); u.lang = "ko-KR"; u.onend = u.onerror = done; speechSynthesis.speak(u); } catch (e) {}
  setTimeout(done, 1500 + text.length * 170);
}
function stopVoice() { vid++; try { speechSynthesis.cancel(); } catch (e) {} }
function toast(t) {
  const el = $("toast"); el.innerHTML = ICON.check + esc(t); el.classList.add("on");
  clearTimeout(el.t); el.t = setTimeout(() => el.classList.remove("on"), 2400);
}

// "split": navi + Chagok side by side (Chagok 841×1210). "navi" / "chagok": that app alone takes the whole slot (1682×1210).
let mode = "split", auto = null;
function front(app) {
  mode = app; const split = app === "split";
  $("slot").classList.toggle("split", split);
  $("navi").classList.toggle("show", app === "navi"); $("chagok").classList.toggle("show", app === "chagok");
  $("d-navi").classList.toggle("active", split || app === "navi"); $("d-chagok").classList.toggle("active", split || app === "chagok");
  $("b-split").classList.toggle("on", split); $("b-navi").classList.toggle("on", app === "navi"); $("b-chagok").classList.toggle("on", app === "chagok");
  const z = $("zone-ours").style; z.left = (split ? 853 + 841 : 853) + "px"; z.width = (split ? 841 : 1682) + "px";
  $("zone-navi").style.visibility = split ? "visible" : "hidden";
  $("zone-ours-label").textContent = split ? "차곡 반 칸 841×1210 · 우리가 그리는 곳" : "앱 칸 1682×1210 · 앱 하나가 전체 사용";
  render();
}
function fit() {
  const s = Math.min(innerWidth / 2560, (innerHeight - 56) / 1440);
  const el = $("screen"); el.style.transform = `scale(${s})`;
  el.style.left = (innerWidth - 2560 * s) / 2 + "px"; el.style.top = Math.max(0, (innerHeight - 56 - 1440 * s) / 2) + "px";
}
addEventListener("resize", fit); fit();

// Backend → Pleos SpeakCommand from the bar. ponytail: guesses the place from "X가 보여요" for the demo only.
function speak(text) {
  const t = text.trim(); if (!t) return;
  const m = t.match(/^(.{2,14}?)(이|가)\s/);
  const name = m ? m[1].replace(/^곧\s*/, "").replace(/^(왼쪽|오른쪽)으로\s*/, "") : null;
  if (mode === "navi") front("chagok");
  if (S.phase !== "live") startTrip();
  showLine({ text:t, place:name ? { name, extra:"12분 추가", reason:"방금 들은 이야기", open:"항상 열림" } : null }, true);
}
function setTheme(dark) {
  $("chagok").classList.toggle("dark", dark); $("chagok").classList.toggle("light", !dark);
  $("b-theme").textContent = dark ? "다크 → 라이트" : "라이트 → 다크";
}

$("b-auto").onclick = () => {
  if (auto) { clearInterval(auto); auto = null; } else { if (S.phase !== "live") startTrip(); auto = setInterval(() => { if (!S.speaking && !S.call && !S.sheet) nextLine(); }, 9000); }
  $("b-auto").classList.toggle("on", !!auto);
};
$("b-call").onclick = () => {
  S.call = !S.call; $("b-call").classList.toggle("on", S.call); $("b-call").textContent = S.call ? "통화 끊기" : "전화 오기";
  if (S.call) { if (S.speaking) { S.held = S.cur ? S.cur.text : null; stopVoice(); S.speaking = false; } render(); toast("통화 중이라 잠시 멈춰요"); }
  else if (S.held) { const t = S.held; S.held = null; voice(t); }
};
$("b-arrive").onclick = arrive;
$("b-theme").onclick = () => setTheme(!$("chagok").classList.contains("dark"));
$("b-split").onclick = () => front("split");
$("b-chagok").onclick = $("d-chagok").onclick = () => front("chagok");
$("b-navi").onclick = $("d-navi").onclick = () => front("navi");
$("b-zones").onclick = () => $("b-zones").classList.toggle("on", document.body.classList.toggle("zones"));
$("b-speak").onclick = () => speak($("speak-text").value);
$("speak-text").onkeydown = e => { if (e.key === "Enter") speak($("speak-text").value); };
$("b-reset").onclick = () => { stopVoice(); clearInterval(auto); auto = null; $("b-auto").classList.remove("on"); fresh(); front("split"); };
setInterval(() => { const d = new Date(); $("clock").textContent = d.toLocaleTimeString("ko-KR", { hour:"2-digit", minute:"2-digit" }).replace(/^(오전|오후) (.*)$/, "$2 $1"); }, 1000);

// Open a state from the address (for links / screenshots): #light #trips #find #record #live #demo #sheet #arrive #diary #zones #navi #full
const h = location.hash;
setTheme(!h.includes("light"));
if (h.includes("trips")) S.showTrips = true;
if (h.includes("find")) S.tab = "find";
if (h.includes("record")) S.tab = "record";
front(h.includes("navi") ? "navi" : h.includes("full") ? "chagok" : "split");
if (h.includes("live")) startTrip();
if (h.includes("demo") || h.includes("sheet") || h.includes("arrive") || h.includes("diary")) { startTrip(); nextLine(); }
if (h.includes("sheet")) openSheet();
if (h.includes("arrive") || h.includes("diary")) { S.saved = ["청초호 둘레길"]; arrive(); }
if (h.includes("diary")) openDiary();
if (h.includes("zones")) $("b-zones").click();
</script>
</body>
</html>
