plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'io.chagok.app'
    compileSdk 34

    defaultConfig {
        applicationId 'io.chagok.app.pleos'
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        // Chagok backend (backend repo, Cloud Run). Local backend: ./gradlew assembleDebug -PchagokApi=http://127.0.0.1:8000 + adb reverse.
        buildConfigField 'String', 'API_BASE_URL', "\"${project.findProperty('chagokApi') ?: 'https://chagok-api-om4h3skohq-du.a.run.app'}\""
    }
    buildTypes {
        // Contest submission APK: signed with the debug key so it installs on the emulator as-is.
        release { signingConfig signingConfigs.debug }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

// Platform Views keep this skeleton small. Phone ↔ Pleos payloads: domain/TripContract.kt + CONTRACT.md.
// Kotlin's standard library is added by the Kotlin Android plugin.

dependencies {
    implementation "ai.pleos.playground:TextToSpeech:3.3.1" // SpeakCommand → Pleos on-device TTS
    implementation "ai.pleos.playground:NaviHelper:3.0.5"  // route to trip places, add approved waypoints
}
